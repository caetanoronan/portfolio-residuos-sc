# ========================================
# Render.com - Build Configuration
# ========================================

services:
  - type: web
    name: api-residuos-sc
    env: python
    region: oregon  # us-west
    plan: free
    branch: main
  buildCommand: pip install --upgrade pip && pip install --only-binary=:all: -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
