# ========================================
# Render.com - Build Configuration
# ========================================

services:
  - type: web
    name: api-residuos-sc
    env: python
    region: oregon  # us-west
    plan: free
    branch: main
    buildCommand: |
      pip install --upgrade pip &&
      pip install --only-binary=:all: numpy==1.26.2 &&
      pip install --only-binary=:all: shapely==2.0.2 &&
      pip install --only-binary=:all: pyogrio==0.9.0 &&
      ( pip install --only-binary=:all: pyproj==3.6.1 || \
        pip install --only-binary=:all: pyproj==3.6.0 || \
        pip install --only-binary=:all: pyproj==3.5.0 || \
        pip install --only-binary=:all: pyproj==3.4.1 ) &&
      pip install --only-binary=:all: geopandas==0.14.1 &&
      pip install --only-binary=:all: fastapi==0.104.1 uvicorn[standard]==0.24.0 python-multipart==0.0.6 pydantic==2.5.0 pydantic-settings==2.1.0 pandas==2.2.0 python-dotenv==1.0.0 requests==2.31.0
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: PIP_ONLY_BINARY
        value: ":all:"
