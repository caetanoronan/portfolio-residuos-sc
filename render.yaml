# ========================================
# Render.com - Build Configuration
# ========================================

services:
  - type: web
    name: api-residuos-sc
    env: python
    region: oregon  # us-west
    plan: free
    branch: main
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PORT
        value: 8000
